[project]
name = "courtroom"
version = "0.1.0"
description = "courtroom using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.159.0,<1.0.0",
]

[project.scripts]
kickoff = "courtroom.main:kickoff"
run_crew = "courtroom.main:kickoff"
plot = "courtroom.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
